// ============================================================================
//  CS 1.6 — Gore Enhanced configuration
//
//  Load me from amxx.cfg with:   exec addons/amxmodx/configs/cs16_gore_enhanced.cfg
//  (or just paste these lines into amxx.cfg / server.cfg directly)
// ============================================================================

// Master switch: 0 = off, 1 = normal gore, 2 = EXTREME (everything doubled)
amx_gore_mode 1

// Extra blood streams and droplet sprays on hits and deaths (0/1)
amx_gore_blood 1

// Blood splat decals on hits and pool decals under corpses (0/1)
amx_gore_decals 1

// Gib bodies on death — fleshy giblets fly out (0/1)
amx_gore_gibs 1

// Base number of giblets per death (doubled in extreme mode and on
// grenade kills). 1-32.
amx_gore_gibcount 6

// Extra-skull chunks + arterial gush on headshot kills (0/1)
amx_gore_headshot 1

// Brief red screen flash for the victim, scaled by damage (0/1)
amx_gore_screenflash 1
